# Full local stack for the RAG Evaluation & Observability Harness.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Services:
#   postgres          -- eval-run history (app DB) + Airflow metadata (own DB)
#   api               -- the RAG pipeline being evaluated (FastAPI, /metrics)
#   prometheus        -- scrapes api:8000/metrics
#   grafana           -- dashboards over Prometheus (provisioned on boot)
#   airflow-init      -- one-shot: migrate Airflow's metadata DB, create admin user
#   airflow-webserver -- Airflow UI (http://localhost:8080)
#   airflow-scheduler -- runs dags/nightly_evaluation_dag.py on its 06:00 UTC schedule
#
# All real API credentials (OpenAI/Anthropic/Voyage/Pinecone) come from the
# repo-root .env via `env_file: ../.env` -- the same file used for local,
# non-Docker development, so there is exactly one place secrets live.
#
# Airflow deliberately runs LocalExecutor, not CeleryExecutor: this project
# has one DAG with two independent branches that run once a night. A
# distributed task queue (Celery + Redis + worker containers) would add
# real operational surface -- another broker to run, monitor, and secure --
# for zero benefit at this concurrency. LocalExecutor forks task processes
# on the scheduler itself, which is the right amount of infrastructure for
# the actual workload. See docs/adr/0004-airflow-local-executor.md.

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/airflow.Dockerfile
  env_file:
    - ../.env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-rag_eval}:${POSTGRES_PASSWORD:-rag_eval}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rag_eval}:${POSTGRES_PASSWORD:-rag_eval}@postgres:5432/rag_eval_harness
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - ../data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_eval}
      POSTGRES_DB: rag_eval_harness
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate `airflow` database on first boot, alongside
      # the `rag_eval_harness` app DB that POSTGRES_DB above creates.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_eval} -d rag_eval_harness"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-rag_eval}:${POSTGRES_PASSWORD:-rag_eval}@postgres:5432/rag_eval_harness
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Nandakumar \
          --lastname Vuppalapati \
          --role Admin \
          --email tech.nandakumar@gmail.com || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  airflow_logs:
