[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "A nightly evaluation and observability harness for a RAG system answering questions over SEC financial filings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nandakumar Vuppalapati" }]

dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-voyageai>=0.1",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "openai>=1.50",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "pinecone>=5.0",
    "ragas>=0.2",
    "datasets>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
orchestration = [
    "apache-airflow>=2.10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These two scripts build the golden dataset from long, human-readable
# question/answer templates and source-citation dicts -- wrapping them
# to fit a line-length limit would make the actual question text harder
# to read and review, which is the opposite of the point of E501 here.
"scripts/build_golden_dataset.py" = ["E501"]
"scripts/build_narrative_questions.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
