name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # No API credentials are configured here on purpose: tests/conftest.py
    # sets placeholder env vars and mocks every external client constructor
    # (Pinecone/Voyage/OpenAI/Anthropic), so the suite makes zero real API
    # calls and needs zero secrets to run in a fork's PR build.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        # Blocking: all findings here were fixed with real code changes
        # (see the "mypy" commit in the log), not suppressed away, so a
        # new one showing up here is a real regression worth stopping on.
        run: mypy src/

      - name: Test
        run: pytest tests/ -v

  validate-orchestration-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Syntax-check the Airflow DAG
        # Doesn't install Airflow itself (heavy, and the DAG's own logic is
        # exercised indirectly through evaluation/harness.py's own tests) --
        # this just catches import-order/syntax mistakes in the DAG file.
        run: python -m py_compile dags/nightly_evaluation_dag.py scripts/load_eval_results.py scripts/run_evaluation.py

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate docker-compose.yml and its service configs parse as YAML
        run: |
          python -c "import yaml; yaml.safe_load(open('docker/docker-compose.yml')); print('docker-compose.yml OK')"
          python -c "import yaml; yaml.safe_load(open('docker/prometheus.yml')); print('prometheus.yml OK')"
          python -c "import yaml; yaml.safe_load(open('docker/grafana/provisioning/datasources/datasource.yml')); print('grafana datasource.yml OK')"
          python -c "import yaml; yaml.safe_load(open('docker/grafana/provisioning/dashboards/dashboards.yml')); print('grafana dashboards.yml OK')"
          python -c "import json; json.load(open('docker/grafana/dashboards/rag_eval_harness.json')); print('grafana dashboard JSON OK')"
